name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Logik testen
        run: node --test
      - name: Syntax der App prüfen
        run: node --check app.js && node --check sw.js
